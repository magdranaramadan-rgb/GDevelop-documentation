<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head> 
    <meta name="google-site-verification" content="yx-UDUX68yd5F3iU7qzhshBKemturXzsthT365O2qK0" /> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJTUBID PRO - Full Experience</title>
    <style>
        :root {
            --sidebar-bg: #1e1f20; --main-bg: #131314; --accent: #4285f4;
            --text-main: #e3e3e3; --border: #444746; --islam-green: #34c759;
            --hover-bg: #2d2f31; --card-bg: #1e1f20;
        }
        .light-mode {
            --sidebar-bg: #f0f2f5; --main-bg: #ffffff; --text-main: #1f1f1f;
            --border: #ddd; --hover-bg: #e4e6e9; --card-bg: #f8f9fa;
        }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--main-bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; transition: 0.3s; }
        
        /* واجهة حدثني عنك */
        #onboarding { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .form-card { background: var(--card-bg); padding: 40px; border-radius: 24px; width: 450px; border: 1px solid var(--accent); text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .form-card input, .form-card textarea { width: 100%; padding: 12px; margin: 15px 0; border-radius: 12px; border: 1px solid var(--border); background: var(--main-bg); color: var(--text-main); box-sizing: border-box; }

        #sidebar { 
            width: 280px; 
            background-color: var(--sidebar-bg); 
            display: flex; 
            flex-direction: column; 
            border-left: 1px solid var(--border); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        #sidebar.collapsed { width: 0; padding: 0; overflow: hidden; border: none; }

        .toggle-btn { background: var(--sidebar-bg); color: var(--text-main); border: 1px solid var(--border); padding: 8px; cursor: pointer; border-radius: 8px; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .collapse-trigger { margin: 15px; }
        #expand-trigger { position: absolute; top: 20px; right: 20px; display: none; }

        .new-chat-btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 25px; margin: 0 20px 20px; cursor: pointer; font-weight: bold; }
        .history-list { flex: 1; overflow-y: auto; padding: 0 15px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-radius: 10px; cursor: pointer; margin-bottom: 5px; font-size: 14px; }
        .history-item:hover { background: var(--hover-bg); }
        .del-chat { color: #ff4d4d; padding: 5px; font-weight: bold; }

        .sidebar-settings { padding: 15px; border-top: 1px solid var(--border); }
        .setting-item { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 10px; cursor: pointer; font-size: 14px; }

        #main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
        header { padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px 10%; display: flex; flex-direction: column; gap: 25px; }

        .msg-row { display: flex; flex-direction: column; gap: 8px; animation: slideUp 0.3s ease; max-width: 100%; }
        .user-row { align-items: flex-end; }
        .ai-row { align-items: flex-start; }
        .bubble { padding: 15px 20px; border-radius: 20px; max-width: 85%; line-height: 1.6; }
        .user-bubble { background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .ai-bubble { background: var(--hover-bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
        
        .tools { display: flex; gap: 10px; opacity: 0; transition: 0.3s; margin-top: 5px; }
        .msg-row:hover .tools { opacity: 1; }
        .tool-btn { cursor: pointer; font-size: 12px; color: var(--accent); border: none; background: none; font-weight: bold; }

        .input-container { padding: 20px 10%; background: var(--main-bg); }
        .input-box { background: var(--hover-bg); border-radius: 35px; padding: 10px 20px; display: flex; align-items: center; border: 1px solid var(--border); }
        input#user-input { flex: 1; background: transparent; border: none; color: var(--text-main); outline: none; font-size: 16px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 600px) { #chat-window, .input-container { padding: 15px 5%; } }
    </style>
</head>
<body>

    <div id="onboarding">
        <div class="form-card">
            <h1 style="color: var(--accent)">حدثني عنك ☪️</h1>
            <input type="text" id="ob-name" placeholder="اسمك الكريم...">
            <textarea id="ob-bio" rows="3" placeholder="أخبرنا عن اهتماماتك يا بطل..."></textarea>
            <button onclick="saveProfile()" class="new-chat-btn" style="width: 100%; margin: 10px 0;">حفظ البيانات</button>
            <button onclick="document.getElementById('onboarding').style.display='none'" style="background:none; border:none; color:gray; cursor:pointer;">إغلاق</button>
        </div>
    </div>

    <div id="sidebar">
        <button class="toggle-btn collapse-trigger" onclick="toggleSidebar()">◀ تصغير</button>
        <button class="new-chat-btn" onclick="startNewChat()">+ محادثة جديدة</button>
        <div class="history-list" id="history-list"></div>
        <div class="sidebar-settings">
            <div class="setting-item" onclick="toggleTheme()">🌓 عكس بين الأبيض والأسود</div>
            <div class="setting-item" onclick="toggleLang()" id="lang-btn">🌐 اللغة: العربية</div>
            <div class="setting-item" onclick="showOnboarding()">👤 تعديل بروفيلي</div>
            <div style="font-size: 11px; opacity: 0.5; padding: 10px; text-align: center; border-top: 1px solid var(--border);">
                المبرمج والمصمم مجد إياد نقشة 🚀
            </div>
        </div>
    </div>

    <div id="main-content">
        <button id="expand-trigger" class="toggle-btn" onclick="toggleSidebar()">▶ القائمة</button>
        <header>
            <div style="font-weight: bold; font-size: 1.2em; color: var(--accent)">MAJTUBID PRO</div>
            <div id="welcome-msg" style="font-size: 14px; opacity: 0.8; cursor:pointer;" onclick="showOnboarding()">أهلاً بك</div>
        </header>
        <div id="chat-window"></div>
        <div class="input-container">
            <div class="input-box">
                <input type="text" id="user-input" placeholder="اسأل أو اطلب رسماً من نانو بانانا 2..." onkeypress="if(event.key === 'Enter') send()">
                <button onclick="send()" style="background:none; border:none; cursor:pointer; font-size:22px;">🚀</button>
            </div>
        </div>
    </div>

    <audio id="snd-send" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>
    <audio id="snd-receive" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3"></audio>

    <script>
        let isEnglish = false;
        let sessions = JSON.parse(localStorage.getItem('majtubid_pro_data') || '{}');
        let currentChatId = Date.now();

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const expandBtn = document.getElementById('expand-trigger');
            sidebar.classList.toggle('collapsed');
            expandBtn.style.display = sidebar.classList.contains('collapsed') ? 'flex' : 'none';
        }

        function showOnboarding() {
            document.getElementById('onboarding').style.display = 'flex';
        }

        function saveProfile() {
            const name = document.getElementById('ob-name').value;
            const bio = document.getElementById('ob-bio').value;
            if(!name) return alert("يرجى كتابة اسمك");
            localStorage.setItem('majtubid_profile', JSON.stringify({name, bio}));
            document.getElementById('onboarding').style.display = 'none';
            document.getElementById('welcome-msg').innerText = `أهلاً يا ${name}`;
            renderHistory();
        }

        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        function toggleLang() {
            isEnglish = !isEnglish;
            document.body.dir = isEnglish ? "ltr" : "rtl";
            document.getElementById('lang-btn').innerText = isEnglish ? "🌐 Language: English" : "🌐 اللغة: العربية";
        }

        function startNewChat() {
            currentChatId = Date.now();
            document.getElementById('chat-window').innerHTML = "";
            renderHistory();
        }

        function deleteChat(id, e) {
            e.stopPropagation();
            if(confirm("هل تريد حذف هذه المحادثة؟")) {
                delete sessions[id];
                localStorage.setItem('majtubid_pro_data', JSON.stringify(sessions));
                if(currentChatId == id) startNewChat();
                else renderHistory();
            }
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = "";
            Object.keys(sessions).reverse().forEach(id => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `<span>💬 ${sessions[id].title}</span><span class="del-chat" onclick="deleteChat('${id}', event)">✕</span>`;
                item.onclick = () => { currentChatId = id; document.getElementById('chat-window').innerHTML = sessions[id].html; };
                list.appendChild(item);
            });
        }

        async function send() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if(!text) return;
            input.value = "";
            document.getElementById('snd-send').play();
            const uId = "u-" + Date.now();
            const win = document.getElementById('chat-window');
            win.innerHTML += `
                <div class="msg-row user-row">
                    <div class="bubble user-bubble" id="${uId}">${text}</div>
                    <div class="tools">
                        <button class="tool-btn" onclick="navigator.clipboard.writeText('${text.replace(/'/g, "\\'")}')">📋 نسخ</button>
                    </div>
                </div>`;
            processAI(text);
        }

        async function processAI(text) {
            const win = document.getElementById('chat-window');
            const aiId = "ai-" + Date.now();
            win.innerHTML += `<div class="msg-row ai-row" id="${aiId}"><div class="bubble ai-bubble">جاري المعالجة...</div></div>`;
            win.scrollTop = win.scrollHeight;

            try {
                const p = JSON.parse(localStorage.getItem('majtubid_profile') || '{"name":"مجد","bio":""}');
                if(text.includes("ارسم") || text.includes("صورة")) {
                    const enhancedPrompt = text + " highly detailed, 8k, professional photography";
                    const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(enhancedPrompt)}?model=nano-banana-2&width=1024&height=1024&nologo=true&seed=${Math.random()}`;
                    document.getElementById(aiId).querySelector('.bubble').innerHTML = `<img src="${imgUrl}" style="width:100%; border-radius:15px;" onload="document.getElementById('snd-receive').play()">`;
                } else {
                    const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}?model=openai&system=Dev:Majd,User:${p.name}`);
                    const data = await res.text();
                    document.getElementById('snd-receive').play();
                    document.getElementById(aiId).querySelector('.bubble').innerText = data;
                }
            } catch {
                document.getElementById(aiId).querySelector('.bubble').innerText = "خطأ في الاتصال.";
            }
            sessions[currentChatId] = { title: text.substring(0,20), html: win.innerHTML };
            localStorage.setItem('majtubid_pro_data', JSON.stringify(sessions));
            renderHistory();
            win.scrollTop = win.scrollHeight;
        }

        window.onload = () => {
            const p = localStorage.getItem('majtubid_profile');
            if(p) {
                const data = JSON.parse(p);
                document.getElementById('welcome-msg').innerText = `أهلاً يا ${data.name}`;
                document.getElementById('ob-name').value = data.name;
                document.getElementById('ob-bio').value = data.bio;
            } else {
                showOnboarding();
            }
            renderHistory();
        };
    </script>
</body>
</html>
