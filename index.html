 <!DOCTYPE html>
<html lang="ar" dir=" rtl">
<head>
  <meta name="google-site-verification" content="A6TjYe_eWldJK5EE3spJ8eNGRkLXKarVdF0T8jBRy18" />
    <meta charset="UTF-8">
    <title> منصة مجتوبيد - إصدار الأوامر الذكية</title>
    <style>
        :root { 
            --bg: #131314; 
            --card: #1e1f20; 
            --accent: #4285f4; 
            --text: #e3e3e3; 
            --islam-green: #34c759;
        }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            transition: 0.5s;
        }

        /*  شاشة الدخول والتسمية  */
        #login-screen { 
            position: fixed; inset: 0; 
            background: radial-gradient(circle, #1e1f20 0%, #131314 100%); 
            z-index: 1000; display: flex; align-items: center; justify-content: center; 
        }
        .login-box { 
            background: var(--card); padding: 40px; border-radius: 25px; 
            text-align: center; border: 2px solid var(--accent); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        header {  
            padding: 10px 20px; background: var(--card); 
            display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 1px solid #444; 
        } 
      

        .logo-container { position: relative; width: 120px; height: 50px; cursor: pointer; }
        .logo-part { position: absolute; font-weight: bold; font-size: 24px; transition: 0.6s; width: 100%; text-align: center; }
        .logo-normal { color: var(--accent); z-index: 2; }
        .logo-flipped { transform: rotateX(180deg); opacity: 0; color: var(--islam-green); }
        .logo-container:hover .logo-flipped { transform: rotateX(0deg); opacity: 1; }
        .logo-container:hover .logo-normal { transform: rotateX(-180deg); opacity: 0; }

                  #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
   .message-wrapper { display: flex; align-items: flex-end; gap: 10px; max-width: 85%; animation: slideUp 0.3s ease; }
             @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

       .user-wrap { align-self: flex-end; flex-direction: row-reverse; }
               .ai-wrap { align-self: flex-start; }

    .message { padding: 12px 18px; border-radius: 18px; font-size: 16px; line-height: 1.5; }
                .user-msg { background: var(--accent); color: white; border-bottom-right-radius: 4px; }
            .ai-msg { background: var(--card); border: 1px solid #444; border-bottom-left-radius: 4px; }

    #typing-indicator { display: none; align-self: flex-start; margin-bottom: 10px; }
             .islam-loader { position: relative; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; }
     .islam-ico { font-size: 22px; animation: rotate360 4s linear infinite; }
                  .ring { position: absolute; width: 38px; height: 38px; border: 3px solid transparent; border-top: 3px solid var(--islam-green); border-radius: 50%; animation: spinRing 1s linear infinite; }
        @keyframes spinRing { 100% { transform: rotate(360deg); } }
      
        @keyframes rotate360 { 0%, 50% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
 
        .input-area { padding: 20px; display: flex; justify-content: center; background: var(--bg); }
        .input-box { background: var(--card); border-radius: 30px; padding: 5px 15px; display: flex; width: 100%; max-width: 800px; border: 1px solid var(--accent); }
        input#user-input { background: transparent; border: none; color: white; flex: 1; outline: none; padding: 10px; font-size: 16px; }
        .btn-send { background: var(--accent); color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1 style="color: var(--accent); margin-bottom: 10px;">مجتوبيد AI</h1>
            <input type="text" id="username-input" placeholder="أدخل اسمك هنا..." style="padding:12px; border-radius:10px; border:none; width: 250px; text-align: center;"> <br>
            <button onclick="login()" class="btn-send" style="margin-top:20px; width: 100px;">دخول</button>
        </div>
    </div>

    <header>
        <div class="logo-container">
            <div class="logo-part logo-normal">مجتوبيد</div>
            <div class="logo-part logo-flipped">☪️</div>
        </div>
        <div><span id="display-user-name" style="font-weight: bold; color: var(--accent);"></span></div>
    </header>

    <div id="chat-container">
        <div id="welcome-area" style="text-align: center; margin-top: 50px;">
            <h2 id="greet-text"></h2>
            <p>اطلب مني فتح أي موقع أو تطبيق وسأفعل ذلك فوراً.</p>
        </div>
    </div>

    <div id="typing-indicator">
        <div class="islam-loader">
            <div class="ring"></div>
            <div class="islam-ico">☪️</div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-box">
            <input type="text" id="user-input" placeholder="مثال: افتح يوتيوب..." onkeypress="if(event.key === 'Enter') send()">
            <button onclick="send()" class="btn-send">إرسال</button>
        </div>
    </div>

    <audio id="sound-out" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
    <audio id="sound-in" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

    <script>
        let userName = "";

        function login() {
            const input = document.getElementById('username-input');
            if(input.value.trim()) {
                userName = input.value;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('display-user-name').innerText = userName;
                document.getElementById('greet-text').innerText = "مرحباً يا " + userName;
            }
        }

        async function send() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const indicator = document.getElementById('typing-indicator');
            let text = input.value.trim();
            if(!text) return;

            document.getElementById('welcome-area').style.display = 'none';
            document.getElementById('sound-out').play();
            container.innerHTML += `<div class="message-wrapper user-wrap"><div class="message user-msg">${text}</div></div>`;
            input.value = "";
            container.scrollTop = container.scrollHeight;

            indicator.style.display = "block";
            container.appendChild(indicator);

            // ميزة فتح المواقع
            if(text.startsWith("افتح") || text.startsWith("شغل")) {
                let site = text.replace("افتح", "").replace("شغل", "").trim();
                let url = "";

                if(site.includes("جوجل")) url = "https://www.google.com";
                else if(site.includes("يوتيوب")) url = "https://www.youtube.com";
                else if(site.includes("فيسبوك")) url = "https://www.facebook.com";
                else url = "https://www." + site + ".com";

                setTimeout(() => {
                    indicator.style.display = "none";
                    document.getElementById('sound-in').play();
                    container.innerHTML += `<div class="message-wrapper ai-wrap"><div class="message ai-msg">جاري الاتصال بالخدمة العامة... سأقوم بفتح ${site} الآن.</div></div>`;
                    container.scrollTop = container.scrollHeight;
                    setTimeout(() => { window.open(url, '_blank'); }, 1500);
                }, 1000);
                return;
            }

            // الرد العادي من السيرفر
            try {
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}?system=أنت مجتوبيد ومطورك هو مجد أياد نقشة`);
                const data = await res.text();
                indicator.style.display = "none";
                document.getElementById('sound-in').play();
                container.innerHTML += `<div class="message-wrapper ai-wrap"><div class="message ai-msg">${data}</div></div>`;
            } catch {
                indicator.style.display = "none";
                container.innerHTML += `<div class="message-wrapper ai-wrap"><div class="message ai-msg">خطأ في الاتصال.</div></div>`;
            }
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
