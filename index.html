<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مجتوبيد PRO - Full Experience</title>
    <style>
        :root {
            --sidebar-bg: #1e1f20; --main-bg: #131314; --accent: #4285f4;
            --text-main: #e3e3e3; --border: #444746; --islam-green: #34c759;
            --hover-bg: #2d2f31; --card-bg: #1e1f20;
        }
        .light-mode {
            --sidebar-bg: #f0f2f5; --main-bg: #ffffff; --text-main: #1f1f1f;
            --border: #ddd; --hover-bg: #e4e6e9; --card-bg: #f8f9fa;
        }
        
        /* تعديل أساسي لعرض الصفحة */
        body { 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--main-bg); 
            color: var(--text-main); 
            display: flex; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            transition: 0.3s; 
        }

        #onboarding { position: fixed; inset: 0; background: var(--main-bg); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .form-card { background: var(--card-bg); padding: 30px; border-radius: 24px; width: 100%; max-width: 450px; border: 1px solid var(--accent); text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .form-card input, .form-card textarea { width: 100%; padding: 12px; margin: 15px 0; border-radius: 12px; border: 1px solid var(--border); background: var(--main-bg); color: var(--text-main); box-sizing: border-box; }

        /* تعديل الـ Sidebar ليتناسب مع الهاتف */
        #sidebar { 
            width: 280px; 
            background-color: var(--sidebar-bg); 
            display: flex; 
            flex-direction: column; 
            border-left: 1px solid var(--border); 
            transition: 0.3s;
            flex-shrink: 0;
        }

        .new-chat-btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 25px; margin: 20px; cursor: pointer; font-weight: bold; }
        .history-list { flex: 1; overflow-y: auto; padding: 0 15px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-radius: 10px; cursor: pointer; margin-bottom: 5px; font-size: 14px; }
        .history-item:hover { background: var(--hover-bg); }
        .sidebar-settings { padding: 15px; border-top: 1px solid var(--border); }
        .setting-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 14px; }
        .setting-item:hover { background: var(--hover-bg); }

        #main-content { flex: 1; display: flex; flex-direction: column; width: 100%; overflow: hidden; }
        header { padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        
        /* تعديل منطقة الشات لتأخذ مساحة أكبر في الهاتف */
        #chat-window { flex: 1; overflow-y: auto; padding: 20px 15%; display: flex; flex-direction: column; gap: 25px; }

        .msg-row { display: flex; flex-direction: column; gap: 8px; animation: slideUp 0.3s ease; }
        .user-row { align-items: flex-end; }
        .ai-row { align-items: flex-start; }
        .bubble { padding: 15px 20px; border-radius: 20px; max-width: 85%; position: relative; line-height: 1.6; word-wrap: break-word; }
        .user-bubble { background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .ai-bubble { background: var(--hover-bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
        
        .tools { display: flex; gap: 12px; opacity: 0; transition: 0.3s; margin-top: 5px; }
        .msg-row:hover .tools { opacity: 1; }
        .tool-btn { cursor: pointer; font-size: 13px; color: var(--accent); border: none; background: none; }

        .input-container { padding: 20px 15%; background: var(--main-bg); }
        .input-box { background: var(--hover-bg); border-radius: 35px; padding: 12px 25px; display: flex; align-items: center; border: 1px solid var(--border); }
        input#user-input { flex: 1; background: transparent; border: none; color: var(--text-main); outline: none; font-size: 16px; width: 100%; }

        .footer-rights { padding: 10px; text-align: center; font-size: 10px; color: var(--accent); border-top: 1px solid var(--border); font-weight: bold; }

        /* Media Queries لإصلاح العرض على الهواتف */
        @media (max-width: 768px) {
            #sidebar { 
                position: absolute; 
                right: -280px; /* إخفاء القائمة الجانبية خارج الشاشة */
                height: 100%; 
                z-index: 1000;
            }
            /* يمكنك إضافة زر لفتح القائمة لاحقاً، حالياً جعلنا المحتوى يأخذ كامل الشاشة */
            #main-content { width: 100vw; }
            #chat-window { padding: 20px 5%; }
            .input-container { padding: 15px 5%; }
            .form-card { padding: 20px; margin: 10px; }
            .bubble { max-width: 95%; }
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="onboarding">
        <div class="form-card">
            <h1 style="color: var(--accent)">حدثني عنك ☪️</h1>
            <p style="opacity: 0.7">أهلاً بك مجدداً في منصتك الاحترافية</p>
            <input type="text" id="ob-name" placeholder="اسمك الكريم...">
            <textarea id="ob-bio" rows="3" placeholder="ماذا تحب أن نفعل اليوم؟ (برمجة، اختراعات، قصص...)"></textarea>
            <button onclick="saveProfile()" class="new-chat-btn" style="width: 100%; margin: 10px 0;">دخول المنصة</button>
        </div>
    </div>

    <div id="sidebar">
        <button class="new-chat-btn" onclick="startNewChat()">+ محادثة جديدة</button>
        <div class="history-list" id="history-list"></div>
        <div class="sidebar-settings">
            <div class="setting-item" onclick="toggleTheme()">🌓 تبديل المظهر</div>
            <div class="setting-item" onclick="toggleLang()" id="lang-btn">🌐 اللغة: العربية</div>
            <div class="setting-item" onclick="alert('سياقك محفوظ ونشط لهذه الجلسة!')">👤 الحالة الشخصية: نشط</div>
        </div>
        <div class="footer-rights">
            تم التطوير والتصميم من قبل مجد اياد نقشة دون حذف اي حرف منه
        </div>
    </div>

    <div id="main-content">
        <header>
            <div style="font-weight: bold; font-size: 1.2em; color: var(--accent)">مجتوبيد PRO</div>
            <div id="welcome-msg" style="font-size: 14px; opacity: 0.8">بانتظار تسجيل الدخول...</div>
        </header>
        <div id="chat-window"></div>
        <div class="input-container">
            <div class="input-box">
                <input type="text" id="user-input" placeholder="اسأل ChatGPT أو اطلب رسماً من نانو بانانا..." onkeypress="if(event.key === 'Enter') send()">
                <button onclick="send()" style="background:none; border:none; cursor:pointer; font-size:22px;">🚀</button>
            </div>
        </div>
    </div>

    <audio id="snd-send" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>
    <audio id="snd-receive" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3"></audio>

    <script>
        let isEnglish = false;
        let sessions = JSON.parse(localStorage.getItem('majtubid_pro_data') || '{}');
        let currentChatId = Date.now();

        function saveProfile() {
            const name = document.getElementById('ob-name').value;
            const bio = document.getElementById('ob-bio').value;
            if(!name) return alert("يرجى كتابة اسمك للمتابعة");
            localStorage.setItem('majtubid_profile', JSON.stringify({name, bio}));
            document.getElementById('onboarding').style.display = 'none';
            document.getElementById('welcome-msg').innerText = `أهلاً يا ${name}`;
            renderHistory();
        }

        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        
        function toggleLang() {
            isEnglish = !isEnglish;
            document.body.dir = isEnglish ? "ltr" : "rtl";
            document.getElementById('lang-btn').innerText = isEnglish ? "🌐 Language: English" : "🌐 اللغة: العربية";
            document.getElementById('user-input').placeholder = isEnglish ? "Type your request..." : "اكتب طلبك هنا...";
        }

        function startNewChat() {
            currentChatId = Date.now();
            document.getElementById('chat-window').innerHTML = "";
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = "";
            Object.keys(sessions).reverse().forEach(id => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `<span>💬 ${sessions[id].title}</span><span onclick="deleteChat('${id}', event)">🗑️</span>`;
                item.onclick = () => { currentChatId = id; document.getElementById('chat-window').innerHTML = sessions[id].html; };
                list.appendChild(item);
            });
        }

        function deleteChat(id, e) {
            e.stopPropagation();
            delete sessions[id];
            localStorage.setItem('majtubid_pro_data', JSON.stringify(sessions));
            startNewChat();
        }

        async function editAndResend(msgId, oldText) {
            const newText = prompt("عدل رسالتك وسأعيد الرد:", oldText);
            if(newText && newText !== oldText) {
                const userMsg = document.getElementById(msgId);
                const userRow = userMsg.closest('.msg-row');
                const nextAi = userRow.nextElementSibling;
                if(nextAi && nextAi.classList.contains('ai-row')) nextAi.remove();
                userMsg.innerText = newText;
                processAI(newText, userRow);
            }
        }

        async function send() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if(!text) return;
            input.value = "";
            document.getElementById('snd-send').play();
            const win = document.getElementById('chat-window');
            const uId = "msg-" + Date.now();
            const userHtml = `
                <div class="msg-row user-row">
                    <div class="bubble user-bubble" id="${uId}">${text}</div>
                    <div class="tools">
                        <button class="tool-btn" onclick="editAndResend('${uId}', '${text.replace(/'/g, "\\'")}')">✏️ تعديل</button>
                        <button class="tool-btn" onclick="navigator.clipboard.writeText('${text.replace(/'/g, "\\'")}')">📋 نسخ</button>
                    </div>
                </div>`;
            win.innerHTML += userHtml;
            processAI(text, null);
        }

        async function processAI(text, existingRow) {
            const win = document.getElementById('chat-window');
            const aiId = "ai-" + Date.now();
            const aiHtml = `<div class="msg-row ai-row" id="${aiId}"><div class="bubble ai-bubble">تفكير...</div></div>`;
            if(existingRow) existingRow.insertAdjacentHTML('afterend', aiHtml);
            else win.innerHTML += aiHtml;
            win.scrollTop = win.scrollHeight;
            try {
                const profile = JSON.parse(localStorage.getItem('majtubid_profile'));
                if(text.includes("ارسم") || text.includes("صورة")) {
                    const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?nologo=true&seed=${Math.random()}`;
                    document.getElementById(aiId).querySelector('.bubble').innerHTML = `<img src="${imgUrl}" style="width:100%; border-radius:15px;">`;
                } else {
                    const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}?model=openai&system=User:${profile.name},Bio:${profile.bio}`);
                    const data = await res.text();
                    document.getElementById('snd-receive').play();
                    document.getElementById(aiId).querySelector('.bubble').innerText = data;
                }
            } catch {
                document.getElementById(aiId).querySelector('.bubble').innerText = "حدث خطأ في الاتصال.";
            }
            sessions[currentChatId] = { title: text.substring(0,25), html: win.innerHTML };
            localStorage.setItem('majtubid_pro_data', JSON.stringify(sessions));
            renderHistory();
            win.scrollTop = win.scrollHeight;
        }

        window.onload = () => {
            const p = localStorage.getItem('majtubid_profile');
            if(p) {
                const data = JSON.parse(p);
                document.getElementById('ob-name').value = data.name;
                document.getElementById('ob-bio').value = data.bio;
            }
            renderHistory();
        };
    </script>
</body>
</html>
